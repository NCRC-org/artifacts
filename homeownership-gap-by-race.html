  :root {
    --ncrc-cyan: #2FADE3; --ncrc-cyan-600: #1F97CC; --ncrc-black:#000000;
    --race-w-l:#2FADE3; --race-w-d:#1F97CC;
    --race-b-l:#eb6834; --race-b-d:#d95926;
    --race-h-l:#1baf7a; --race-h-d:#199e70;
    --race-ai-l:#eda100; --race-ai-d:#c98500;
    --race-as-l:#e87ba4; --race-as-d:#d55181;
    --race-nh-l:#008300; --race-nh-d:#008300;

    --n-0:#FFFFFF; --n-50:#F6F6F7; --n-200:#DFE0E3; --n-500:#818390; --n-600:#5F6069; --n-800:#24252A; --n-900:#0D0E10;

    --bg:var(--n-0); --fg:var(--ncrc-black); --fg-muted:var(--n-600); --fg-subtle:var(--n-500);
    --border:var(--n-200); --border-strong:var(--ncrc-black); --accent:var(--ncrc-cyan);
    --card-bg:var(--n-50);
    --race-w:var(--race-w-l); --race-b:var(--race-b-l); --race-h:var(--race-h-l);
    --race-ai:var(--race-ai-l); --race-as:var(--race-as-l); --race-nh:var(--race-nh-l);
    --weak-band: rgba(138,99,0,.10); --weak-band-border: rgba(138,99,0,.35);
    --blend-band: rgba(95,96,105,.08); --blend-band-border: rgba(95,96,105,.30);
    --gap-area: rgba(95,96,105,.16);
    --grid-line:var(--n-200); --axis-text:var(--n-500); --crosshair:var(--n-500);
    --tooltip-bg:var(--n-0); --tooltip-border:var(--n-800);

    --font-display:'Barlow Condensed','Helvetica Neue Condensed','HelveticaNeue-CondensedBold','Oswald',Impact,sans-serif;
    --font-body:'Barlow','Helvetica Neue',Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0D0E10; --fg:#F2F2F3; --fg-muted:#B9BAC0; --fg-subtle:#8B8D96;
      --border:#2C2D33; --border-strong:#F2F2F3; --accent:#57C4EE; --card-bg:#16171A;
      --race-w:var(--race-w-d); --race-b:var(--race-b-d); --race-h:var(--race-h-d);
      --race-ai:var(--race-ai-d); --race-as:var(--race-as-d); --race-nh:var(--race-nh-d);
      --weak-band: rgba(232,184,75,.10); --weak-band-border: rgba(232,184,75,.35);
      --blend-band: rgba(185,186,192,.08); --blend-band-border: rgba(185,186,192,.28);
      --gap-area: rgba(185,186,192,.18);
      --grid-line:#2C2D33; --axis-text:#8B8D96; --crosshair:#5F6069; --tooltip-bg:#16171A; --tooltip-border:#F2F2F3;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0D0E10; --fg:#F2F2F3; --fg-muted:#B9BAC0; --fg-subtle:#8B8D96;
    --border:#2C2D33; --border-strong:#F2F2F3; --accent:#57C4EE; --card-bg:#16171A;
    --race-w:var(--race-w-d); --race-b:var(--race-b-d); --race-h:var(--race-h-d);
    --race-ai:var(--race-ai-d); --race-as:var(--race-as-d); --race-nh:var(--race-nh-d);
    --weak-band: rgba(232,184,75,.10); --weak-band-border: rgba(232,184,75,.35);
    --blend-band: rgba(185,186,192,.08); --blend-band-border: rgba(185,186,192,.28);
    --gap-area: rgba(185,186,192,.18);
    --grid-line:#2C2D33; --axis-text:#8B8D96; --crosshair:#5F6069; --tooltip-bg:#16171A; --tooltip-border:#F2F2F3;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }

  .embed {
    width:100%; max-width:1100px; aspect-ratio:16/9; margin:0 auto;
    display:flex; flex-direction:column; gap:8px;
    border:1px solid var(--border-strong); background:var(--bg);
    padding:clamp(8px,1.6vw,16px) clamp(10px,2vw,20px) clamp(6px,1vw,10px);
  }
  .topbar { flex:none; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px 16px; }
  .brand-group { display:flex; align-items:center; gap:10px; min-width:0; }
  .logo { height:clamp(24px,3.2vw,34px); width:auto; display:block; flex:none; }
  .brand { font-family:var(--font-display); font-weight:700; font-size:clamp(16px,2.2vw,24px); letter-spacing:.02em; text-transform:uppercase; color:var(--accent); white-space:nowrap; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; }
  .seg { display:inline-flex; border:1.5px solid var(--border-strong); flex:none; }
  .seg button {
    font-family:var(--font-display); font-weight:700; font-size:clamp(13px,1.6vw,16px); letter-spacing:.02em; text-transform:uppercase;
    padding:7px clamp(9px,1.3vw,14px); background:var(--bg); color:var(--fg-muted); border:none; cursor:pointer; white-space:nowrap;
  }
  .seg button:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .seg button.active { background:var(--fg); color:var(--bg); }
  .seg button + button { border-left:1.5px solid var(--border-strong); }
  .seg button[data-race] { color:var(--race-swatch, var(--fg-muted)); }

  .body { flex:1 1 auto; min-height:0; display:flex; gap:clamp(8px,1.4vw,18px); transition:opacity .22s ease; }
  @media (prefers-reduced-motion: reduce) { .body { transition:none; } }
  .chart-wrap { flex:1 1 auto; min-width:0; position:relative; }
  svg#chart { width:100%; height:100%; display:block; }

  .sidebar { flex:0 1 clamp(120px,20%,210px); display:flex; flex-direction:column; gap:clamp(5px,1vw,9px); min-width:0; }
  .card { border:1px solid var(--border); background:var(--card-bg); padding:clamp(6px,1vw,10px) clamp(8px,1.1vw,11px); flex:1 1 0; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .card .num { font-family:var(--font-display); font-weight:800; font-size:clamp(24px,4.6vw,44px); line-height:1; font-variant-numeric:tabular-nums; }
  .card .lbl { font-size:clamp(10.5px,1.25vw,13px); color:var(--fg-subtle); margin-top:5px; line-height:1.3; }

  .footer { flex:none; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px 14px; }
  .footer .cite { font-size:clamp(8.5px,0.9vw,10.5px); color:var(--fg-subtle); line-height:1.4; }
  .share { display:flex; align-items:center; gap:6px; flex:none; }
  .share-lbl { font-size:clamp(8.5px,0.9vw,10.5px); color:var(--fg-subtle); margin-right:2px; }
  .share-btn {
    font-family:var(--font-display); font-weight:700; font-size:clamp(9px,0.95vw,10.5px); letter-spacing:.03em; text-transform:uppercase;
    padding:3px 8px; border:1px solid var(--border); color:var(--fg-muted); text-decoration:none; background:none; cursor:pointer; white-space:nowrap;
  }
  .share-btn:hover, .share-btn:focus-visible { border-color:var(--border-strong); color:var(--fg); }

  .gridline { stroke:var(--grid-line); stroke-width:1; }
  .axis-text { fill:var(--axis-text); font-family:var(--font-body); font-size:14px; }
  .axis-text.year { font-family:var(--font-display); font-weight:600; font-size:14.5px; }
  .band-weak { fill:var(--weak-band); }
  .band-weak-edge { stroke:var(--weak-band-border); stroke-width:1; stroke-dasharray:2 2; }
  .band-blend { fill:var(--blend-band); }
  .band-blend-edge { stroke:var(--blend-band-border); stroke-width:1; stroke-dasharray:2 2; }
  .band-label { font-family:var(--font-body); font-size:11.5px; font-style:italic; fill:var(--fg-subtle); }
  .landmark-line { stroke:var(--fg-subtle); stroke-width:1; stroke-dasharray:4 3; }
  .landmark-label { font-family:var(--font-body); font-size:11.5px; fill:var(--fg-muted); }
  .zero-line { stroke:var(--fg-muted); stroke-width:1.25; }
  .gap-area { fill:var(--gap-area); stroke:none; }
  .series-line { fill:none; stroke-width:2.25; }
  .series-line.weak { opacity:.6; stroke-dasharray:2 3; }
  .series-line.ghost { stroke:var(--fg-subtle); stroke-width:1.5; stroke-dasharray:1 3; opacity:.7; }
  .series-proj { fill:none; stroke-width:1.75; stroke-dasharray:5 4; }
  .series-band { opacity:.16; stroke:none; }
  .dot { fill:var(--bg); stroke-width:2; }
  .end-label { font-family:var(--font-display); font-weight:700; font-size:14px; }
  .callout-line { stroke:var(--fg-subtle); stroke-width:1.25; stroke-dasharray:3 3; }
  .callout-text { fill:var(--fg-muted); font-family:var(--font-body); font-size:13px; }
  .callout-text .hl { font-family:var(--font-display); font-weight:700; font-size:17px; fill:var(--fg); }
  .crosshair-line { stroke:var(--crosshair); stroke-width:1; pointer-events:none; }

  .tooltip {
    position:absolute; pointer-events:none; background:var(--tooltip-bg); border:1px solid var(--tooltip-border);
    padding:7px 10px; font-size:11.5px; line-height:1.5; min-width:150px; opacity:0; transition:opacity .1s ease; z-index:5;
  }
  @media (prefers-reduced-motion: reduce) { .tooltip { transition:none; } }
  .tooltip.show { opacity:1; }
  .tooltip .ty { font-family:var(--font-display); font-weight:700; font-size:13px; margin-bottom:3px; }

  const RACES = {
    w:  {label:'White',    var:'--race-w'},
    b:  {label:'Black',    var:'--race-b', projEligible:true},
    h:  {label:'Hispanic', var:'--race-h', projEligible:true},
    ai: {label:'AIAN',     var:'--race-ai'},
    as: {label:'Asian',    var:'--race-as', startYear:2010},
    nh: {label:'NHPI',     var:'--race-nh', startYear:2010},
  };
  // JCHS only projects White NH, Black, and Hispanic individually. AIAN, Asian, and NHPI have no
  // usable JCHS projection — their only JCHS figure is a combined "Asian and Another race" bucket

  // projection is shown for them at all rather than a misleading stand-in.
  const confLabel = {
    'direct':'Direct measurement', 'interp':'Interpolated', 'weak':'Weak anchor (pre-1900)',
    'interp-weak':'Interpolated, weak anchors', 'direct-blend':'Direct, two-survey blend',
    'direct-blend-partial':'Direct, partial-year caveat', 'projection':'JCHS projection, not measured',
  };
  const nonProj = rows.filter(r => !r.proj);
  const projRows = rows.filter(r => r.proj);

  let mode = 'rate', race = 'b';

  function valueFor(row, key) {
    if (mode === 'rate') return row[key];
    if (key === 'w') return null;
    const white = row.wnh != null ? row.wnh : row.w;
    const v = row[key];
    return (white == null || v == null) ? null : white - v;
  }
  function domainFor(key) {
    const r = RACES[key];
    const years = nonProj.filter(row => row[key] != null && (!r.startYear || row.y >= r.startYear)).map(row => row.y);
    return {min: Math.min(...years), max: r.projEligible ? 2035 : Math.max(...years)};
  }
  function seriesFor(key, dMin) {
    const r = RACES[key];
    return nonProj.filter(row => valueFor(row, key) != null && row.y >= dMin && (!r.startYear || row.y >= r.startYear))
      .map(row => ({y: row.y, v: valueFor(row, key), c: row.c, note: row.note}));
  }
  function projFor(key) {
    const r = RACES[key];
    if (!r.projEligible) return null;
    const by = {};
    projRows.forEach(row => { const v = valueFor(row, key); if (v != null) (by[row.y] = by[row.y] || {})[row.scenario] = v; });
    if (!by[2030] || !by[2035]) return null;
    const anchorRow = [...nonProj].reverse().find(row => valueFor(row, key) != null);
    return {anchor:{y:anchorRow.y, v:valueFor(anchorRow, key)}, y2030:by[2030], y2035:by[2035]};
  }
  function whiteProj() {
    // 'w' (any ethnicity) has no JCHS projection, only 'wnh' (non-Hispanic) does.
    // Apply wnh's projected point-change onto the w 2025 anchor, same rebasing convention
    // already used elsewhere in this dataset, so the White line doesn't jump at the definition seam.
    const row2025 = rows.find(r => r.y === 2025);
    const w0 = row2025.w, wnh0 = row2025.wnh;
    const by = {};
    projRows.forEach(row => { if (row.wnh != null) (by[row.y] = by[row.y] || {})[row.scenario] = w0 + (row.wnh - wnh0); });
    if (!by[2030] || !by[2035]) return null;
    return {anchor:{y:2025, v:w0}, y2030:by[2030], y2035:by[2035]};
  }
  function niceStep(span) { return span > 60 ? 20 : (span >= 25 ? 10 : 5); }
  function computeRateYDomain() {
    const vals = [];
    seriesFor('w', xMin).forEach(p => vals.push(p.v));
    const wProj = (xMax >= 2030) ? whiteProj() : null;
    if (wProj) vals.push(wProj.anchor.v, ...Object.values(wProj.y2030), ...Object.values(wProj.y2035));
    seriesFor(race, xMin).forEach(p => vals.push(p.v));
    const proj = projFor(race);
    if (proj) vals.push(...Object.values(proj.y2030), ...Object.values(proj.y2035));
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = Math.max(4, (hi - lo) * 0.15);
    lo = Math.max(0, Math.floor((lo - pad) / 5) * 5);
    hi = Math.min(100, Math.ceil((hi + pad) / 5) * 5);
    if (hi - lo < 20) { const mid = (hi + lo) / 2; lo = Math.max(0, Math.floor((mid - 10) / 5) * 5); hi = Math.min(100, Math.ceil((mid + 10) / 5) * 5); }
    return {lo, hi};
  }
  function computeGapYDomain() {
    const vals = [0];
    seriesFor(race, xMin).forEach(p => vals.push(p.v));
    const proj = projFor(race);
    if (proj) vals.push(...Object.values(proj.y2030), ...Object.values(proj.y2035));
    let hi = Math.max(...vals);
    hi = Math.ceil((hi + Math.max(3, hi * 0.12)) / 5) * 5;
    return {lo:0, hi};
  }
  function narrowestGapYear(key, dMin, dMax) {
    const pts = nonProj.filter(row => row.y >= dMin && row.y <= dMax).map(row => {
      const white = row.wnh != null ? row.wnh : row.w;
      const v = row[key];
      return (white == null || v == null) ? null : {y: row.y, v: white - v};
    }).filter(Boolean);
    if (!pts.length) return null;
    let lo = pts[0];
    pts.forEach(p => { if (p.v < lo.v) lo = p; });
    return lo;
  }
  function minMax(key, dMin, dMax) {
    const pts = nonProj.filter(row => row.y >= dMin && row.y <= dMax && valueFor(row, key) != null)
      .map(row => ({y: row.y, v: valueFor(row, key)}));
    let lo = pts[0], hi = pts[0];
    pts.forEach(p => { if (p.v < lo.v) lo = p; if (p.v > hi.v) hi = p; });
    return {lo, hi};
  }
  function makeTicks(min, max) {
    const span = max - min, step = span > 80 ? 20 : (span >= 25 ? 10 : 5);
    let ticks = [];
    for (let y = min; y <= max; y += step) ticks.push(y);
    // Always show domain min/max and, when the domain crosses it, the 2025 historical/projection seam.
    // Drop any auto-generated tick that would crowd against one of those anchors instead of just appending.
    const anchors = [min, max];
    if (min < 2025 && max >= 2025) anchors.push(2025);
    const minGap = step * 0.6;
    anchors.forEach(a => { ticks = ticks.filter(t => t === a || Math.abs(t - a) >= minGap); });
    anchors.forEach(a => { if (!ticks.includes(a)) ticks.push(a); });
    return Array.from(new Set(ticks)).sort((a, b) => a - b);
  }

  const svg = document.getElementById('chart');
  const tooltip = document.getElementById('tooltip');
  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  const M = {l:38, r:56, t:14, b:28};
  const W = 800, H = 480;
  const plotW = W - M.l - M.r, plotH = H - M.t - M.b;
  let xMin, xMax, yMin = 0, yMax = 100;
  function xs(y) { return M.l + (y - xMin) / (xMax - xMin) * plotW; }
  function ys(v) { return M.t + plotH - (v - yMin) / (yMax - yMin) * plotH; }
  function pathFor(pts) { return pts.map((p,i) => (i===0?'M':'L') + xs(p.y) + ' ' + ys(p.v)).join(' '); }

  let firstRender = true;
  function draw() {
    const bodyEl = document.querySelector('.body');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (firstRender || reduceMotion) {
      firstRender = false;
      renderChart();
      return;
    }
    bodyEl.style.opacity = '0';
    setTimeout(() => { renderChart(); bodyEl.style.opacity = '1'; }, 220);
  }

  function renderChart() {
    svg.innerHTML = '';
    const dom = domainFor(race);
    xMin = dom.min; xMax = dom.max;
    const yDom = mode === 'rate' ? computeRateYDomain() : computeGapYDomain();
    yMin = yDom.lo; yMax = yDom.hi;

    if (race === 'b' && xMin <= 1900) {
      svg.appendChild(el('rect', {class:'band-weak', x:xs(1870), y:M.t, width:xs(1900)-xs(1870), height:plotH}));
      svg.appendChild(el('line', {class:'band-weak-edge', x1:xs(1900), x2:xs(1900), y1:M.t, y2:M.t+plotH}));
      const l = el('text', {class:'band-label', x:xs(1870)+3, y:M.t+12}); l.textContent = 'weak data'; svg.appendChild(l);
    }
    if (xMin <= 1968 && xMax >= 1968) {
      svg.appendChild(el('line', {class:'landmark-line', x1:xs(1968), x2:xs(1968), y1:M.t, y2:M.t+plotH}));
      const ll = el('text', {class:'landmark-label', x:xs(1968)+4, y:M.t+plotH-6});
      ll.textContent = 'Fair Housing Act, 1968';
      svg.appendChild(ll);
    }

    const yStep = niceStep(yMax - yMin);
    const yTicks = [];
    for (let v = yMin; v <= yMax; v += yStep) yTicks.push(v);
    const yTopTick = yTicks[yTicks.length - 1];
    yTicks.forEach(v => {
      svg.appendChild(el('line', {class:'gridline', x1:M.l, x2:M.l+plotW, y1:ys(v), y2:ys(v)}));
      const t = el('text', {class:'axis-text', x:M.l-7, y:ys(v)+4, 'text-anchor':'end'});
      t.textContent = v + (mode === 'rate' && v === yTopTick ? '%' : '');
      svg.appendChild(t);
    });
    if (mode === 'gap') svg.appendChild(el('line', {class:'zero-line', x1:M.l, x2:M.l+plotW, y1:ys(0), y2:ys(0)}));
    makeTicks(xMin, xMax).forEach(y => {
      const t = el('text', {class:'axis-text year', x:xs(y), y:H-8, 'text-anchor':'middle'}); t.textContent = y; svg.appendChild(t);
    });

    if (mode === 'rate') {
      const wColor = css('--race-w');
      const wPts = seriesFor('w', xMin);
      if (wPts.length > 1) {
        svg.appendChild(el('path', {class:'series-line', d:pathFor(wPts), style:`stroke:${wColor}`}));
      }
      const wProj = (xMax >= 2030) ? whiteProj() : null;
      let lastW = wPts.length ? wPts[wPts.length-1] : null;
      if (wProj) {
        const s30 = Object.values(wProj.y2030), s35 = Object.values(wProj.y2035);
        const bandD = [[wProj.anchor.y,wProj.anchor.v],[2030,Math.min(...s30)],[2035,Math.min(...s35)],[2035,Math.max(...s35)],[2030,Math.max(...s30)],[wProj.anchor.y,wProj.anchor.v]]
          .map(([y,v],i) => (i===0?'M':'L') + xs(y) + ' ' + ys(v)).join(' ') + ' Z';
        svg.appendChild(el('path', {class:'series-band', d:bandD, style:`fill:${wColor}`}));
        svg.appendChild(el('path', {class:'series-proj', d:`M ${xs(wProj.anchor.y)} ${ys(wProj.anchor.v)} L ${xs(2030)} ${ys(wProj.y2030.Base)} L ${xs(2035)} ${ys(wProj.y2035.Base)}`, style:`stroke:${wColor}`}));
        lastW = {y:2035, v:wProj.y2035.Base};
      }
      if (lastW) {
        svg.appendChild(el('circle', {class:'dot', cx:xs(lastW.y), cy:ys(lastW.v), r:3.5, style:`stroke:${wColor}`}));
        svg.appendChild(Object.assign(el('text', {class:'end-label', x:xs(lastW.y)+6, y:ys(lastW.v)-9, style:`fill:${wColor}`}), {textContent:'White'}));
      }
    }

    const color = css(RACES[race].var);
    const pts = seriesFor(race, xMin);
    if (mode === 'gap' && pts.length > 1) {
      const areaD = pathFor(pts) + ` L ${xs(pts[pts.length-1].y)} ${ys(0)} L ${xs(pts[0].y)} ${ys(0)} Z`;
      svg.appendChild(el('path', {class:'gap-area', d:areaD}));
    }
    const weakPts = pts.filter(p => p.y <= 1900);
    const solidPts = pts.filter(p => p.y >= 1900);
    if (weakPts.length > 1) svg.appendChild(el('path', {class:'series-line weak', d:pathFor(weakPts), style:`stroke:${color}`}));
    if (pts.length) svg.appendChild(el('path', {class:'series-line', d:pathFor(solidPts.length?solidPts:pts), style:`stroke:${color}`}));

    const proj = projFor(race);
    if (proj) {
      const s30 = Object.values(proj.y2030), s35 = Object.values(proj.y2035);
      const bandD = [[proj.anchor.y,proj.anchor.v],[2030,Math.min(...s30)],[2035,Math.min(...s35)],[2035,Math.max(...s35)],[2030,Math.max(...s30)],[proj.anchor.y,proj.anchor.v]]
        .map(([y,v],i) => (i===0?'M':'L') + xs(y) + ' ' + ys(v)).join(' ') + ' Z';
      svg.appendChild(el('path', {class:'series-band', d:bandD, style:`fill:${color}`}));
      svg.appendChild(el('path', {class:'series-proj', d:`M ${xs(proj.anchor.y)} ${ys(proj.anchor.v)} L ${xs(2030)} ${ys(proj.y2030.Base)} L ${xs(2035)} ${ys(proj.y2035.Base)}`, style:`stroke:${color}`}));
    }
    if (pts.length) {
      const last = pts[pts.length-1];
      svg.appendChild(el('circle', {class:'dot', cx:xs(last.y), cy:ys(last.v), r:3.5, style:`stroke:${color}`}));
      svg.appendChild(Object.assign(el('text', {class:'end-label', x:xs(last.y)+6, y:ys(last.v)+17, style:`fill:${color}`}), {textContent:RACES[race].label}));
    }

    {
      const narrow = narrowestGapYear(race, dom.min, Math.min(dom.max, 2025));
      if (narrow) {
        const row = rows.find(r => r.y === narrow.y);
        const whiteVal = row.wnh != null ? row.wnh : row.w;
        let yWhite, yRace, dotV;
        if (mode === 'rate') { yWhite = ys(whiteVal); yRace = ys(row[race]); dotV = row[race]; }
        else { yWhite = ys(0); yRace = ys(narrow.v); dotV = narrow.v; }
        const yTop = Math.min(yWhite, yRace), yBot = Math.max(yWhite, yRace);
        svg.appendChild(el('line', {class:'callout-line', x1:xs(narrow.y), x2:xs(narrow.y), y1:yTop, y2:yBot}));
        svg.appendChild(el('circle', {class:'dot', cx:xs(narrow.y), cy:ys(dotV), r:4, style:`stroke:${color}`}));
        const ct = el('text', {class:'callout-text', 'text-anchor':'start'});
        ct.innerHTML = `<tspan class="hl" x="${xs(narrow.y)+8}" y="${yBot+18}">${narrow.y}</tspan><tspan x="${xs(narrow.y)+8}" y="${yBot+33}">Lowest Gap</tspan>`;
        svg.appendChild(ct);
      }
    }

    const crossLine = el('line', {class:'crosshair-line', y1:M.t, y2:M.t+plotH, style:'display:none;'});
    const overlay = el('rect', {x:M.l, y:M.t, width:plotW, height:plotH, fill:'transparent'});
    svg.appendChild(crossLine); svg.appendChild(overlay);
    const allYears = Array.from(new Set(nonProj.filter(r=>r.y>=xMin&&r.y<=2025).map(r=>r.y).concat(xMax>=2030?[2030]:[]).concat(xMax>=2035?[2035]:[]))).sort((a,b)=>a-b);
    overlay.addEventListener('mousemove', e => {
      const rect = svg.getBoundingClientRect(), scale = W/rect.width;
      const mx = (e.clientX - rect.left) * scale;
      const yearRaw = xMin + (mx-M.l)/plotW*(xMax-xMin);
      let nearest = allYears[0], best = Infinity;
      allYears.forEach(y => { const d = Math.abs(y-yearRaw); if (d<best) { best=d; nearest=y; } });
      crossLine.setAttribute('x1', xs(nearest)); crossLine.setAttribute('x2', xs(nearest)); crossLine.style.display='';
      let rowsHtml = '', anchor = (yMin + yMax) / 2;
      tooltip.dataset.note = '';
      if (mode === 'rate') {
        const row = nonProj.find(r => r.y===nearest);
        if (row && row.w != null) rowsHtml += `<div class="tr"><span><span class="sw" style="background:${css('--race-w')}"></span>White</span><span>${row.w.toFixed(1)}</span></div>`;
      }
      if (nearest === 2030 || nearest === 2035) {
        const proj = projFor(race);
        if (proj) { const s = nearest===2030?proj.y2030:proj.y2035; const vals=Object.values(s); rowsHtml += `<div class="tr"><span><span class="sw" style="background:${color}"></span>${RACES[race].label}</span><span>${Math.min(...vals).toFixed(1)}&ndash;${Math.max(...vals).toFixed(1)}</span></div>`; anchor = Math.min(...vals); tooltip.dataset.note = confLabel.projection; }
      } else {
        const row = nonProj.find(r => r.y===nearest);
        if (row) { const v = valueFor(row, race); if (v != null) { rowsHtml += `<div class="tr"><span><span class="sw" style="background:${color}"></span>${RACES[race].label}</span><span>${v.toFixed(1)}</span></div>`; anchor = v; tooltip.dataset.note = confLabel[row.c] || ''; } }
      }
      const noteRow = tooltip.dataset.note ? `<div class="note">${tooltip.dataset.note}</div>` : '';
      tooltip.innerHTML = `<div class="ty">${nearest}</div>${rowsHtml}${noteRow}`;
      tooltip.classList.add('show');
      const tx = xs(nearest)/W*rect.width, ty = ys(anchor)/H*rect.height;
      let left = tx+12; if (left+180>rect.width) left = tx-180;
      tooltip.style.left = left+'px'; tooltip.style.top = Math.max(0,ty-28)+'px';
    });
    overlay.addEventListener('mouseleave', () => { crossLine.style.display='none'; tooltip.classList.remove('show'); });

    buildCards(dom);
  }

  function buildCards(dom) {
    const sidebar = document.getElementById('sidebar');
    sidebar.innerHTML = '';
    const label = RACES[race].label;
    const row2025 = nonProj.find(r => r.y === 2025);
    const cards = [];
    if (mode === 'rate') {
      const white2025 = row2025.wnh != null ? row2025.wnh : row2025.w;
      cards.push({num: (white2025 - row2025[race]).toFixed(1), lbl: label+' gap to White, 2025 (pts)'});
      cards.push({num: row2025[race].toFixed(1)+'%', lbl: label+' homeownership, 2025'});
      const mm = minMax(race, dom.min, 2025);
      cards.push({num: mm.lo.v.toFixed(1)+'–'+mm.hi.v.toFixed(1), lbl:'Range, '+dom.min+'–'+2025});
    } else {
      const g2025 = valueFor(row2025, race);
      cards.push({num: g2025.toFixed(1), lbl: label+' gap, 2025 (pts)'});
      const proj = projFor(race);
      if (proj) {
        const vals = Object.values(proj.y2035);
        cards.push({num: Math.min(...vals).toFixed(1)+'–'+Math.max(...vals).toFixed(1), lbl:'Projected 2035 gap range'});
      } else {
        const mm = minMax(race, dom.min, 2025);
        cards.push({num: mm.lo.v.toFixed(1), lbl:'Narrowest gap, '+mm.lo.y});
      }
      const mm2 = minMax(race, dom.min, 2025);
      cards.push({num: mm2.hi.v.toFixed(1), lbl:'Widest gap, '+mm2.hi.y});
    }
    cards.forEach(c => {
      const d = document.createElement('div'); d.className = 'card';
      d.innerHTML = `<div class="num">${c.num}</div><div class="lbl">${c.lbl}</div>`;
      sidebar.appendChild(d);
    });
  }

  document.getElementById('modeSwitch').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#modeSwitch button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); mode = b.dataset.mode; draw();
  });
  document.getElementById('raceSwitch').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#raceSwitch button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); race = b.dataset.race; draw();
  });

  draw();

  (function setupShare() {
    const shareUrl = location.href;
    const shareText = 'Homeownership by race, 1870–2035 — NCRC';
    const u = encodeURIComponent(shareUrl), t = encodeURIComponent(shareText);
    document.getElementById('shareX').href = `https://twitter.com/intent/tweet?text=${t}&url=${u}`;
    document.getElementById('shareFB').href = `https://www.facebook.com/sharer/sharer.php?u=${u}`;
    document.getElementById('shareLI').href = `https://www.linkedin.com/sharing/share-offsite/?url=${u}`;
    document.getElementById('shareCopy').addEventListener('click', function() {
      const btn = this, original = btn.textContent;
      const done = () => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = original; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(done).catch(done);
      } else { done(); }
    });
  })();
</script>
